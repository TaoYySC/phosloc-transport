feature_sets:
  esm_window_only_supcon_ce:
    input_keys:
    - esm_window
    blocks:
      esm_window:
        type: esm_window_site_pca
        embedding_dir: data/TF_esm_embedding
        acc_col: ACC_ID
        pos_col: POSITION
        window_size: 41
        embedding_dim: 1280
        window_pooling: mean
        use_window_embedding: true
        use_site_embedding: true
        reducer: kernel_pls
        separate_reduction_per_embedding: true
        pls_components_window: 96
        pls_components_site: 96
        standardize_before_reduction: true
        fill_missing: false
        kernel: rbf
